
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JARVIS_PhoneOnly_Project.zip'
      - '.github/workflows/build-jarvis.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o JARVIS_PhoneOnly_Project.zip -d source
          test -f source/JARVIS_Android_Starter/settings.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/JARVIS_Android_Starter/app/build.gradle.kts")
          s = p.read_text()
          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}""",
                  1,
              )
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: source/JARVIS_Android_Starter
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: source/JARVIS_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
